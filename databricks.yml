bundle:
  name: pulselake

variables:
  workspace_host:
    description: Workspace HTTPS URL; supplied by scripts/configure.py or BUNDLE_VAR_workspace_host
  catalog:
    description: Existing catalog in which to create the project's schemas
    default: workspace
  warehouse_id:
    description: SQL warehouse ID from your workspace (required for dbt)

workspace:
  host: ${var.workspace_host}

sync:
  include:
    - databricks/**
    - dbt/**
  exclude:
    - runtime/**
    - .venv/**
    - .tools/**
    - .env
    - dbt/profiles.yml
    - dbt/target/**
    - dbt/logs/**
    - output/**
    - tmp/**

resources:
  jobs:
    pulselake_hourly:
      name: PulseLake Pipeline
      max_concurrent_runs: 1
      timeout_seconds: 3600
      schedule:
        quartz_cron_expression: '0 0 * * * ?'
        timezone_id: Asia/Calcutta
        pause_status: PAUSED
      environments:
        - environment_key: dbt
          spec:
            environment_version: '2'
            dependencies:
              - 'dbt-databricks==1.13.0'
      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: ./databricks/00_setup.py
            base_parameters:
              catalog: ${var.catalog}
          max_retries: 1
        - task_key: bronze
          depends_on:
            - task_key: setup
          notebook_task:
            notebook_path: ./databricks/01_bronze.py
            base_parameters:
              catalog: ${var.catalog}
          max_retries: 1
        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ./databricks/02_silver.py
            base_parameters:
              catalog: ${var.catalog}
          max_retries: 1
        - task_key: gold
          depends_on:
            - task_key: silver
          environment_key: dbt
          dbt_task:
            project_directory: ${workspace.file_path}/dbt
            source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
            catalog: ${var.catalog}
            schema: pulselake_gold
            commands:
              - dbt build

targets:
  dev:
    default: true
    mode: development
