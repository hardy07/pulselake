name: pulselake
services:
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "127.0.0.1:29092:29092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 18
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command: ["--bootstrap-server", "kafka:9092", "--create", "--if-not-exists", "--topic", "music.events", "--partitions", "3", "--replication-factor", "1"]

  spark:
    build:
      context: .
      dockerfile: docker/Dockerfile.spark
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      SPARK_TRIGGER_INTERVAL: "${SPARK_TRIGGER_INTERVAL:-120 seconds}"
      SPARK_LOCAL_IP: 127.0.0.1
    volumes:
      - "${PULSELAKE_DATA_DIR:-./runtime}:/data"
      - spark-ivy:/root/.ivy2
    ports:
      - "127.0.0.1:4040:4040"
    stop_grace_period: 45s
    restart: unless-stopped

  producer:
    profiles: [generate]
    build:
      context: .
      dockerfile: docker/Dockerfile.producer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    command: ["--count", "10000", "--rate", "25"]

volumes:
  kafka-data:
  spark-ivy:
